# The whole TaskTide stack for the VDS: Caddy in front, the Next.js app, the API,
# Postgres and Redis. Expects both repos cloned side by side:
#   ~/tasktide/tasktide_frontend   (this repo)
#   ~/tasktide/tasktide_backend
# Run from this folder: docker compose up -d --build
# Only Caddy is reachable from outside (ports 80 and 443).
# TR: VDS için tüm TaskTide yığını: önde Caddy, Next.js uygulaması, API, Postgres ve Redis.
# TR: Dışarıdan sadece Caddy'ye erişilebilir (80 ve 443 portları).

services:
    caddy:
        image: caddy:2-alpine
        environment:
            DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - web
            - api
        restart: unless-stopped

    web:
        build: ..
        restart: unless-stopped

    api:
        build: ../../tasktide_backend
        environment:
            PORT: 8000
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: ${DB_USER:-tasktide}
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
            DB_NAME: ${DB_NAME:-tasktide}
            REDIS_URL: redis://redis:6379
            # Same origin as the frontend, because Caddy serves both.
            CORS_ORIGIN: https://${DOMAIN}
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?set SUPER_ADMIN_EMAIL in deploy/.env}
            SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in deploy/.env}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${DB_USER:-tasktide}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME:-tasktide}
        volumes:
            - db_data:/var/lib/postgresql/data
            - ../../tasktide_backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:8-alpine
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    caddy_data:
    caddy_config:
    db_data:
    redis_data:
