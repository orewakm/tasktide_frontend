# Runs the app on http://localhost:3000 against the backend on http://localhost:8000.
# TR: Uygulamayı http://localhost:3000 adresinde, http://localhost:8000 adresindeki backend ile çalıştırır.

services:
    web:
        build:
            context: .
            args:
                NEXT_PUBLIC_API_URL: http://localhost:8000
        ports:
            - '3000:3000'
